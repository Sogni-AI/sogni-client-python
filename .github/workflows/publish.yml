# Publishes to PyPI when a v* tag is pushed.
#
# Uses PyPI Trusted Publishing (OpenID Connect): there is no API token stored
# anywhere. GitHub proves the workflow's identity to PyPI directly, so nothing
# can be leaked from repo secrets and nothing needs rotating.
#
# This file does nothing until BOTH are true:
#   1. A trusted publisher for this repo exists on PyPI (owner Sogni-AI,
#      repository sogni-client-python, workflow publish.yml, environment pypi).
#   2. A tag matching v* is pushed.
#
# After a tag publishes to PyPI, the github-release job creates the GitHub
# release for that tag (skipped when it already exists). Sogni's public
# changelog lists Python SDK versions from these releases.
name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        run: |
          python -m pip install build
          python -m build
      - name: Verify the tag matches the packaged version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          packaged="$(ls dist/*.tar.gz | sed -E 's/.*-([0-9][^-]*)\.tar\.gz/\1/')"
          if [ "$tag" != "$packaged" ]; then
            echo "Tag $GITHUB_REF_NAME does not match packaged version $packaged." >&2
            echo "Update version in pyproject.toml and sogni_client/__init__.py first." >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # The environment name must match the one registered with the trusted
    # publisher on PyPI. Add required reviewers to it in GitHub repo settings
    # if you want a manual approval gate before anything is published.
    environment:
      name: pypi
      url: https://pypi.org/p/sogni-client
    permissions:
      # Mandatory for Trusted Publishing; this is what mints the OIDC token.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create the GitHub release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      # Creating a release (and generating its notes) needs write access to
      # contents. Only this job has it; the PyPI job keeps only id-token.
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Create the release for this tag unless it exists
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi
          version="${TAG#v}"
          # gh joins these notes and the generated ones with one newline; the
          # trailing newline here keeps them separate paragraphs.
          printf -v notes 'This release matches [JavaScript SDK %s](https://github.com/Sogni-AI/sogni-client/releases/tag/v%s).\n\nPackage: https://pypi.org/project/sogni-client/%s/\n' "$version" "$version" "$version"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$TAG" --notes "$notes" --generate-notes
